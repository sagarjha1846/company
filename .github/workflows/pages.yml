name: Deploy study to GitHub Pages

# Run this manually (Actions tab -> Run workflow) once Pages is enabled with
# Source: GitHub Actions. It is not on a push trigger on purpose: until Pages
# is switched on, every run fails at configure-pages, and a permanently red
# branch is worse than a manual button. The generated site is committed under
# docs/, so the "Deploy from a branch" route needs no CI at all.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the static site from the markdown sources
        run: python3 tools/build_site.py

      - uses: actions/configure-pages@v5
        with:
          # tries to switch Pages on; needs repo-admin rights, which the
          # workflow's GITHUB_TOKEN does not have - enable it in Settings first
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
